name: CS2 Price Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-price-scraper
  cancel-in-progress: false

env:
  DELAY: 5
  WORKERS: 2
  # Cloudflare blocks headless Chrome: run headed under a virtual display.
  CHROME_HEADED: "true"
  CHROME_PATH: /usr/bin/chromium

jobs:
  scrape-all-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Chromium, Xvfb and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium xvfb fonts-liberation

    - name: Install Go dependencies
      run: go mod tidy

    # ===== CASES =====
    - name: Scrape Cases
      continue-on-error: true
      run: |
        xvfb-run -a go run . -cases-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::cases scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/cases.json

    # ===== WEAPONS =====
    - name: Scrape Weapons
      continue-on-error: true
      run: |
        xvfb-run -a go run . -weapons-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::weapons scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/weapons.json

    # ===== GLOVES =====
    - name: Scrape Gloves
      continue-on-error: true
      run: |
        xvfb-run -a go run . -gloves-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::gloves scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/gloves.json

    # ===== AGENTS =====
    - name: Scrape Agents
      continue-on-error: true
      run: |
        xvfb-run -a go run . -agents-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::agents scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/agents.json

    # ===== STICKERS =====
    - name: Scrape Stickers
      continue-on-error: true
      run: |
        xvfb-run -a go run . -stickers-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::stickers scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/stickers.json

    # ===== SOUVENIRS =====
    - name: Scrape Souvenirs
      continue-on-error: true
      run: |
        xvfb-run -a go run . -souvenirs-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::souvenirs scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/souvenirs.json

    # ===== PINS =====
    - name: Scrape Pins
      continue-on-error: true
      run: |
        xvfb-run -a go run . -pins-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::pins scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/pins.json

    # ===== PATCHES =====
    - name: Scrape Patches
      continue-on-error: true
      run: |
        xvfb-run -a go run . -patches-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }} || echo "::warning::patches scrape failed"
        [ -f json/data.json ] || echo '{"skins":[],"agents":[],"misc":[]}' > json/data.json
        cp json/data.json json/patches.json

    - name: Merge JSON files
      run: |
        node -e "
        const fs = require('fs');
        const files = ['cases', 'weapons', 'gloves', 'agents', 'stickers', 'souvenirs', 'pins', 'patches'];
        const merged = { skins: [], agents: [], misc: [] };

        for (const f of files) {
          try {
            const data = JSON.parse(fs.readFileSync('json/' + f + '.json', 'utf8'));
            if (data.skins) merged.skins.push(...data.skins);
            if (data.agents) merged.agents.push(...data.agents);
            if (data.misc) merged.misc.push(...data.misc);
          } catch(e) {
            console.log('Warning: Could not read ' + f + '.json:', e.message);
          }
        }

        fs.writeFileSync('json/data.json', JSON.stringify(merged, null, 2));
        console.log('Merged ' + merged.skins.length + ' skins, ' + merged.agents.length + ' agents, ' + merged.misc.length + ' misc items');
        "

    - name: Upload scraped JSON
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cs2-prices-${{ github.run_number }}
        path: json/
        if-no-files-found: ignore

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p json
        git add json/
        if git diff-index --quiet HEAD -- json/; then
          echo "No JSON changes to commit, skipping push."
          exit 0
        fi
        git commit -m "Авто-обновление цен: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        # Remote may have moved ahead while this run was scraping (manual pushes).
        git pull --rebase --autostash origin main || git pull --rebase origin main
        git push
