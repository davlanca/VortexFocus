name: CS2 Price Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-price-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Chromium and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium fonts-liberation

    - name: Install Go dependencies
      run: go mod tidy

    - name: Run Scraper
      run: go run . --delay=3 --workers=2
      env:
        CHROME_PATH: /usr/bin/chromium

    - name: Upload scraped JSON
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cs2-prices-${{ github.run_number }}
        path: json/
        if-no-files-found: ignore

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p json
        git add json/
        if git diff-index --quiet HEAD -- json/; then
          echo "No JSON changes to commit, skipping push."
          exit 0
        fi
        git commit -m "Авто-обновление цен: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        git push
