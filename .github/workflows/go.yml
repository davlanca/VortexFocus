name: CS2 Price Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install Google Chrome and Dependencies
      run: |
        sudo apt-get update
        # Установка зависимостей, специфичных для Ubuntu 24.04 (Noble)
        sudo apt-get install -y google-chrome-stable \
          libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
          libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
          libxss1 libasound2t64 fonts-liberation libappindicator3-1 \
          libu2f-udev libvulkan1 xdg-utils

    - name: Install Go dependencies
      run: go mod tidy

    - name: Run Scraper
      run: go run main.go -stealth
      env:
        CHROME_PATH: /usr/bin/google-chrome-stable

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p json
        git add json/
        if git diff-index --quiet HEAD -- json/; then
          echo "No JSON changes to commit, skipping push."
          exit 0
        fi
        git commit -m "Авто-обновление цен: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        git push
