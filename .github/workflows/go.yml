name: CS2 Price Scraper

on:
schedule:
# Запуск каждые 6 часов
- cron: '0 */6 * * *'
workflow_dispatch:

permissions:
contents: write

concurrency:
group: cs2-price-scraper
cancel-in-progress: false

env:
DELAY: 3
WORKERS: 2

jobs:
scrape-all-categories:
runs-on: ubuntu-latest
timeout-minutes: 360

```
steps:
  # ============================================================
  # CHECKOUT
  # ============================================================

  - name: Checkout repository
    uses: actions/checkout@v4

  # ============================================================
  # GO
  # ============================================================

  - name: Set up Go
    uses: actions/setup-go@v5
    with:
      go-version: '1.24'

  # ============================================================
  # GOOGLE CHROME
  # ============================================================

  - name: Install Google Chrome
    run: |
      wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      sudo apt-get update
      sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      google-chrome --version

  # ============================================================
  # GO DEPENDENCIES
  # ============================================================

  - name: Download Go dependencies
    run: |
      go mod download

  # ============================================================
  # CASES
  # ============================================================

  - name: Scrape Cases
    run: |
      go run . -cases-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/cases.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # WEAPONS
  # ============================================================

  - name: Scrape Weapons
    run: |
      go run . -weapons-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/weapons.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # GLOVES
  # ============================================================

  - name: Scrape Gloves
    run: |
      go run . -gloves-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/gloves.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # AGENTS
  # ============================================================

  - name: Scrape Agents
    run: |
      go run . -agents-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/agents.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # STICKERS
  # ============================================================

  - name: Scrape Stickers
    run: |
      go run . -stickers-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/stickers.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # SOUVENIRS
  # ============================================================

  - name: Scrape Souvenirs
    run: |
      go run . -souvenirs-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/souvenirs.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # PINS
  # ============================================================

  - name: Scrape Pins
    run: |
      go run . -pins-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/pins.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # PATCHES
  # ============================================================

  - name: Scrape Patches
    run: |
      go run . -patches-only --delay=${{ env.DELAY }} --workers=${{ env.WORKERS }}
      cp json/data.json json/patches.json
    env:
      CHROME_PATH: /usr/bin/google-chrome

  # ============================================================
  # MERGE ALL CATEGORIES
  # ============================================================

  - name: Merge JSON files
    run: |
      node <<'NODE'
      const fs = require('fs');

      const files = [
        'cases',
        'weapons',
        'gloves',
        'agents',
        'stickers',
        'souvenirs',
        'pins',
        'patches'
      ];

      const merged = {
        skins: [],
        agents: [],
        misc: []
      };

      for (const file of files) {
        const path = `json/${file}.json`;

        try {
          if (!fs.existsSync(path)) {
            console.log(`Warning: ${path} does not exist`);
            continue;
          }

          const data = JSON.parse(
            fs.readFileSync(path, 'utf8')
          );

          if (Array.isArray(data.skins)) {
            merged.skins.push(...data.skins);
          }

          if (Array.isArray(data.agents)) {
            merged.agents.push(...data.agents);
          }

          if (Array.isArray(data.misc)) {
            merged.misc.push(...data.misc);
          }

          console.log(
            `Loaded ${file}: ` +
            `${data.skins?.length || 0} skins, ` +
            `${data.agents?.length || 0} agents, ` +
            `${data.misc?.length || 0} misc`
          );

        } catch (error) {
          console.log(
            `Warning: Could not read ${path}: ${error.message}`
          );
        }
      }

      fs.writeFileSync(
        'json/data.json',
        JSON.stringify(merged, null, 2) + '\n'
      );

      console.log('');
      console.log('========================================');
      console.log('MERGE COMPLETE');
      console.log('========================================');
      console.log(`Skins:  ${merged.skins.length}`);
      console.log(`Agents: ${merged.agents.length}`);
      console.log(`Misc:   ${merged.misc.length}`);
      console.log('========================================');
      NODE

  # ============================================================
  # GENERATE data.js FOR LOCAL file:// USAGE
  # ============================================================

  - name: Generate browser database
    run: |
      node <<'NODE'
      const fs = require('fs');

      const json = fs.readFileSync(
        'json/data.json',
        'utf8'
      );

      const data = JSON.parse(json);

      const output =
        'window.CS2_DATA = ' +
        JSON.stringify(data) +
        ';\n';

      fs.writeFileSync(
        'json/data.js',
        output
      );

      console.log(
        `Generated json/data.js (${Buffer.byteLength(output, 'utf8')} bytes)`
      );
      NODE

  # ============================================================
  # VALIDATE FINAL DATABASE
  # ============================================================

  - name: Validate final database
    run: |
      node <<'NODE'
      const fs = require('fs');

      const json = JSON.parse(
        fs.readFileSync('json/data.json', 'utf8')
      );

      if (!json || typeof json !== 'object') {
        throw new Error('data.json is not a valid object');
      }

      if (!Array.isArray(json.skins)) {
        throw new Error('data.json.skins is not an array');
      }

      if (!Array.isArray(json.agents)) {
        throw new Error('data.json.agents is not an array');
      }

      if (!Array.isArray(json.misc)) {
        throw new Error('data.json.misc is not an array');
      }

      if (!fs.existsSync('json/data.js')) {
        throw new Error('json/data.js was not generated');
      }

      const dataJs = fs.readFileSync(
        'json/data.js',
        'utf8'
      );

      if (!dataJs.startsWith('window.CS2_DATA = ')) {
        throw new Error(
          'data.js does not contain window.CS2_DATA'
        );
      }

      console.log('Final database validation passed.');
      console.log(`Skins:  ${json.skins.length}`);
      console.log(`Agents: ${json.agents.length}`);
      console.log(`Misc:   ${json.misc.length}`);
      console.log('data.js: OK');
      NODE

  # ============================================================
  # UPLOAD ARTIFACT
  # ============================================================

  - name: Upload scraped data
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: cs2-prices-${{ github.run_number }}
      path: json/
      if-no-files-found: ignore

  # ============================================================
  # COMMIT UPDATED DATABASE
  # ============================================================

  - name: Commit and Push changes
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      mkdir -p json

      git add json/

      if git diff --cached --quiet; then
        echo "No database changes to commit."
        exit 0
      fi

      git commit -m "Auto-update CS2 prices: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

      git push
```
