name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "Visual Studio C++ workload was not found" }
          Write-Host "Using Visual Studio at $vs"

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3485.44" -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath webview2-package
          New-Item -ItemType Directory -Path webview2 -Force | Out-Null
          Move-Item webview2-package webview2\Microsoft.Web.WebView2
          if (-not (Test-Path "webview2\Microsoft.Web.WebView2\build\native\include\WebView2.h")) {
            throw "WebView2.h was not found after extracting the SDK"
          }

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}\webview2

      - name: Build VST3
        run: cmake --build build --config Release --target VortexFocus_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VortexFocus-Windows-VST3
          path: build/VortexFocus_artefacts/Release/VST3